services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: johanwillemsen
    ports:
      # 3306 is MAMP, 3307 is 123huren — this project gets 3308.
      - "3308:3306"
    volumes:
      - johanwillemsen_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # prioIP uses 8000, 123huren 8001 — this project gets 8002.
      - "8002:8002"
    volumes:
      - ./backend:/var/www/html
      - johanwillemsen_backend_vendor:/var/www/html/vendor
      - ./backend/.env.docker:/var/www/html/.env
      # The design assets live with the frontend, but PHP (and the image tooling
      # in the backend image) is what optimizes them — see `images:optimize`.
      - ./frontend/public:/var/www/frontend-public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Browser-side calls go through the published port; server-side (SSR)
      # calls stay on the compose network.
      NEXT_PUBLIC_API_URL: http://localhost:8002/api
      INTERNAL_API_URL: http://backend:8002/api
    ports:
      # prioIP uses 3000, 123huren 3001 — this project gets 3002.
      - "3002:3002"
    volumes:
      - ./frontend:/app
      - johanwillemsen_frontend_node_modules:/app/node_modules

volumes:
  johanwillemsen_mysql_data:
  johanwillemsen_backend_vendor:
  johanwillemsen_frontend_node_modules:
